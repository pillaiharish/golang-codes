name: God Prep Layer 2 examples

on:
  pull_request:
    paths:
      - "god-is-great-prep/**"
      - ".github/workflows/god-prep-layer2.yml"
  push:
    branches: [main]
    paths:
      - "god-is-great-prep/**"
      - ".github/workflows/god-prep-layer2.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: god-is-great-prep/layer2/examples
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: god-is-great-prep/layer2/examples/go.mod
      - name: Test examples
        run: go test ./...
      - name: Vet examples
        run: go vet ./...
